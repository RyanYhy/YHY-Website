<script>
(function () {
  var fine = window.matchMedia('(hover: hover) and (pointer: fine)');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)');
  var forced = window.matchMedia('(forced-colors: active)');

  function allowed() {
    return fine.matches && !reduce.matches && !forced.matches;
  }

  if (!allowed()) return;

  // The reticle is the homepage's fullscreen cursor. Every other page keeps
  // the system pointer, I-beam, and resize cursors.
  if (!document.body.classList.contains('td-profile-page')) return;

  var root = document.documentElement;
  var cursor = document.createElement('div');
  cursor.className = 'td-stark-cursor is-off';
  cursor.setAttribute('aria-hidden', 'true');
  cursor.innerHTML = '<div class="td-stark-cursor__ring"><div class="td-stark-cursor__scale"><span class="td-stark-cursor__ticks"></span></div></div><div class="td-stark-cursor__core"></div>';
  document.body.appendChild(cursor);

  var ring = cursor.firstElementChild;
  var core = cursor.lastElementChild;
  root.classList.add('has-stark-cursor');

  var x = 0;
  var y = 0;
  var rx = 0;
  var ry = 0;
  var raf = 0;
  var active = false;

  var fieldSel = 'input, textarea, select, option, [contenteditable="true"]';
  var interactiveSel = 'a, button, summary, [role="button"], [role="link"]';

  function mode(el) {
    if (!el || !el.closest) return 'hud';
    if (root.hasAttribute('data-td-shell-resizing')) return 'native';
    if (el.closest('.td-filetree[data-td-filetree-dragging]')) return 'native';
    if (el.closest('.td-shell-sidebar__resizer, .td-filetree__divider, .td-image-zoom__trigger')) return 'native';
    if (el.closest(':disabled, [aria-disabled="true"]')) return 'native';
    if (el.closest(interactiveSel)) return 'lock';
    if (el.closest(fieldSel)) return 'native';
    return 'hud';
  }

  function apply(el) {
    var next = mode(el);
    var showHud = active && (next === 'hud' || next === 'lock');
    if (showHud && cursor.classList.contains('is-off')) {
      rx = x;
      ry = y;
    }
    cursor.classList.toggle('is-off', !showHud);
    root.classList.toggle('is-stark-locked', next === 'lock');
  }

  function tick() {
    rx += (x - rx) * 0.58;
    ry += (y - ry) * 0.58;
    core.style.transform = 'translate3d(' + x + 'px,' + y + 'px,0)';
    ring.style.transform = 'translate3d(' + rx + 'px,' + ry + 'px,0)';
    var dx = x - rx;
    var dy = y - ry;
    if (dx * dx + dy * dy > 0.16) raf = window.requestAnimationFrame(tick);
    else raf = 0;
  }

  function kick() {
    if (!raf) raf = window.requestAnimationFrame(tick);
  }

  function onMove(e) {
    if (e.pointerType && e.pointerType !== 'mouse' && e.pointerType !== 'pen') return;
    active = true;
    x = e.clientX;
    y = e.clientY;
    apply(e.target);
    kick();
  }

  function onOut(e) {
    if (e.relatedTarget) return;
    active = false;
    cursor.classList.add('is-off');
    root.classList.remove('is-stark-locked');
  }

  document.addEventListener('pointermove', onMove, { passive: true });
  document.addEventListener('mouseout', onOut);

  function teardown() {
    root.classList.remove('has-stark-cursor', 'is-stark-locked');
    if (cursor.parentNode) cursor.parentNode.removeChild(cursor);
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('mouseout', onOut);
    if (raf) window.cancelAnimationFrame(raf);
    raf = 0;
  }

  function onPref() {
    if (!allowed()) teardown();
  }

  fine.addEventListener('change', onPref);
  reduce.addEventListener('change', onPref);
  forced.addEventListener('change', onPref);
})();
</script>
