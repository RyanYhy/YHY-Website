sections:
  - hero
  - type: cards
    key: highlights
  - cta

hero:
  eyebrow: 学习 · 项目 · 笔记
  title_lines:
    - words:
        - { text: YHY Study Website }
  lead: 个人站点：经历介绍、主题学习笔记，以及按日期的博客。
  image:
    light: images/ironman.webp
    dark: images/ironman.webp
    alt: 钢铁侠插图
  actions:
    - label: 学习
      url: learn/
      icon: fa-solid fa-book-open
      style: primary
    - label: 项目
      url: experience/
      icon: fa-solid fa-briefcase
      style: ghost
    - label: 博客
      url: blog/
      icon: fa-solid fa-arrow-right
      style: ghost

highlights:
  title: 四个栏目
  desc: 不同类型的内容各有入口。
  items:
    - title: 经历
      url: experience/
      icon: fa-solid fa-briefcase
      desc: 项目与比赛介绍。
    - title: 学习
      url: learn/
      icon: fa-solid fa-book-open
      desc: 按主题整理的笔记。
    - title: 博客
      url: blog/
      icon: fa-solid fa-blog
      desc: 按日期的更新与感想。
    - title: 友链
      url: links/
      icon: fa-solid fa-link
      desc: 友情链接。

cta:
  title: 开始写内容
  text: 把占位页换成你自己的项目、笔记与博文即可。
  actions:
    - label: 打开学习
      url: learn/
      icon: fa-solid fa-book-open
      style: primary
    - label: 打开博客
      url: blog/
      icon: fa-solid fa-pen
      style: ghost
