# cSpell:ignore goldmark markmap plantuml readingtime
#
# baseURL moved to be after params
title: YHY Study Website
enableRobotsTXT: true
enableGitInfo: true
enableEmoji: true
defaultContentLanguage: zh

ignoreLogs:
  # Project-documentation pages intentionally override theme parameters.
  - warning-frontmatter-params-overrides # cSpell:disable-line
  - giscus-not-configured

# Allow iframe-hosted custom themes (for example, Giscus) to load during local previews.
# These headers are only used by `hugo server`; they do not affect generated production files.
server:
  headers:
    - for: /**
      values:
        Access-Control-Allow-Origin: '*'

outputs:
  home: [HTML, markdown, LLMS]
  page: [HTML, markdown]
  section: [HTML, RSS, print, markdown]

# services:
#   googleAnalytics:
#     id: G-6JLQEHYFQG

imaging:
  resampleFilter: CatmullRom # cSpell:disable-line

markup:
  tableOfContents:
    endLevel: 4
  goldmark:
    parser:
      # Block images can carry an attribute line ({caption=…}, Book figures).
      wrapStandAloneImageWithinParagraph: false
      attribute:
        block: true
    extensions:
      passthrough:
        enable: true
        delimiters:
          block: [['\[', '\]'], ['$$', '$$']]
          inline: [['\(', '\)']]
    renderer:
      unsafe: true
  highlight:
    noClasses: false # Required for dark-mode

languages:
  zh:
    label: 简体中文
    locale: zh-CN
    weight: 1
    title: YHY Study Website
    hasCJKLanguage: true
    params:
      description: 笔记、项目与学习文档
      ui:
        navbar_autohide: true
        command_palette:
          commands: []
    menus:
      main:
        - identifier: experience
          name: 经历
          pageRef: /experience
          weight: 20
          params:
            icon: fa-solid fa-briefcase
        - identifier: learn
          name: 学习
          pageRef: /learn
          weight: 30
          params:
            icon: fa-solid fa-book-open
        - identifier: blog
          name: 博客
          pageRef: /blog
          weight: 40
          params:
            icon: fa-solid fa-blog
        - identifier: links
          name: 友链
          pageRef: /links
          weight: 50
          params:
            icon: fa-solid fa-link
        - identifier: github
          name: GitHub
          url: https://github.com/RyanYhy/YHY-Website
          weight: 90
          params:
            icon: fa-brands fa-github

params:
  # Keep theme pin fields for CI release-pin check; no navbar version menu.
  tdVersion:
    latest: v0.6.0
  version: v0.6.0
  hugoMinVersion: &hugoMinVersion 0.160.1
  productionURL: &productionURL https://ryanyhy.github.io/YHY-Website/
  logo: images/avatar.png
  copyright:
    authors: '[Ryan Yhy](https://github.com/RyanYhy)'
    from_year: 2026
    to_year: present
  footer_center_info: 'Powered by [Oink](https://oink.pgsty.com)'
  github_repo: https://github.com/RyanYhy/YHY-Website
  github_project_repo: https://github.com/RyanYhy/YHY-Website
  github_subdir: ''
  offline_search: true
  offline_search_on_serve: true
  offline_search_index: summary
  offline_search_summary_length: 70
  offline_search_max_results: 10
  page_width: normal
  ui:
    typography: technical
    blog_index_toggle: true
    section_index: cards
    blog_index: cards
    blog_index_columns: 3
    taxonomy_icons:
      categories: fa-solid fa-folder
      tags: fa-solid fa-tags
      authors: fa-solid fa-user-pen
      series: fa-solid fa-layer-group
    quick_links: []
    sidebar_icon_policy: groups
    page_context_menu:
      enable: true
      assistant_links: false
      links: []
    dark_mode: true
    sidebar_menu_compact: true
    sidebar_menu_foldable: true
    sidebar_root_enabled: true
    sidebar_root_menu: true
    sidebar_width_min: 200
    sidebar_width_max: 500
    sidebar_item_overflow: ellipsis
    sidebar_menu_truncate: 2000
    sidebar_expand_levels: 2
    feedback:
      enable: false
      reasons: true
    reading_time: false
  plantuml:
    enable: false
  print:
    toc: true
  markmap: false
  drawio:
    enable: false

baseURL: *productionURL

taxonomies:
  tag: tags
  category: categories

module:
  imports:
    - path: github.com/pgsty/oink
  hugoVersion:
    extended: true
    min: *hugoMinVersion
  mounts:
    - source: content
      target: content
      sites: { matrix: { languages: [zh] } }
